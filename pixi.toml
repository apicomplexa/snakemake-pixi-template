# pixi.toml is the single source of truth for every software environment in
# this repository:
#   * `default`  — interactive work (notebooks, Quarto, editors) + Snakemake itself
#   * every other environment — a per-rule conda env, exported to
#     workflow/envs/<env>.yaml (+ <env>.<platform>.pin.txt) by `pixi run export-envs`
#     and referenced from rules via `conda: "../envs/<env>.yaml"`.
# Never edit workflow/envs/* by hand — change this file, then re-export.

[workspace]
name = "snakemake-pixi-template"
version = "0.1.0"
channels = ["conda-forge", "bioconda", "nodefaults"]
platforms = ["linux-64"]

# ---------------------------------------------------------------------------
# Default feature: workflow orchestration. Only in the `default` env —
# rule envs set `no-default-feature = true`.
# ---------------------------------------------------------------------------
[dependencies]
python = ">=3.13,<3.14"
snakemake = ">=9.27.0,<10"
pandas = ">=2.3.3,<3"
conda = ">=26.7.3,<27"     # Snakemake builds rule envs with conda
graphviz = ">=14.1.2,<15"  # `pixi run dag`

# Applies to the conda that Snakemake calls, without touching ~/.condarc
[activation.env]
CONDA_CHANNEL_PRIORITY = "strict"

# ---------------------------------------------------------------------------
# Analysis features: one per rule environment. Add new tool-specific features
# here (e.g. [feature.qc.dependencies] fastqc/multiqc) and a matching entry
# under [environments].
# ---------------------------------------------------------------------------
[feature.r.dependencies]
r-base = ">=4.5.3,<4.6"
r-tidyverse = ">=2.0.0,<3"
r-knitr = ">=1.52,<2"
r-rmarkdown = ">=2.32,<3"
quarto = ">=1.9.38,<2"

[feature.py.dependencies]
python = ">=3.13,<3.14"
numpy = ">=2.5.4,<3"
pandas = ">=2.3.3,<3"

# ---------------------------------------------------------------------------
# Developer tooling: kernels, language servers, linters, formatters.
# Never exported to workflow/envs.
# ---------------------------------------------------------------------------
[feature.dev.dependencies]
jupyter = ">=1.1.1,<2"
ipykernel = ">=7.4.0,<8"
r-irkernel = ">=1.3.2,<2"
r-languageserver = ">=0.3.20,<0.4"
r-lintr = ">=3.4.0,<4"
air = ">=0.12.0,<0.13"
ruff = ">=0.17.1,<0.18"
snakefmt = ">=2.1.0,<3"
pre-commit = ">=4.7.0,<5"

# ---------------------------------------------------------------------------
# Environments. A shared solve-group guarantees that a package present in
# several envs has the *same* version everywhere, so code developed in the
# interactive `default` env behaves identically inside a rule.
# Move a rule env out of the group only if it truly conflicts (e.g. a tool
# pinned to an old Python) — give it its own solve-group or none.
# ---------------------------------------------------------------------------
[environments]
default = { features = ["r", "py", "dev"], solve-group = "main" }
r = { features = ["r"], no-default-feature = true, solve-group = "main" }
py = { features = ["py"], no-default-feature = true, solve-group = "main" }

# ---------------------------------------------------------------------------
# Tasks. Extra CLI args are appended, e.g. `pixi run workflow --cores 16`.
# Run flags (cores, memory, conda) live in workflow/profiles/default/config.yaml.
# ---------------------------------------------------------------------------
[tasks]
init = { cmd = "bash utils/init_project.sh", description = "Turn the template into a new project: init <name> [description]" }
export-envs = { cmd = "python utils/export_envs.py", inputs = ["pixi.lock"], outputs = ["workflow/envs/*.yaml", "workflow/envs/*.pin.txt"], description = "Export rule environments to workflow/envs/" }

workflow = { cmd = "snakemake", depends-on = ["export-envs"], description = "Run the workflow" }
dry-run = { cmd = "snakemake --dry-run", depends-on = ["export-envs"], description = "Show what would be executed" }
unlock = { cmd = "snakemake --unlock", description = "Remove a stale Snakemake lock" }
dag = { cmd = "mkdir -p results/reports && snakemake --dry-run --dag --quiet | sed -n '/^digraph/,$p' | dot -Tpdf > results/reports/workflow-dag.pdf", description = "Render the job DAG" }
sm-report = { cmd = "snakemake --report results/reports/snakemake-report.html", description = "Snakemake HTML run report" }

fmt = { cmd = "ruff format workflow utils && ruff check --fix workflow utils && snakefmt workflow && air format workflow", description = "Format Python, Snakemake and R code" }
lint = { cmd = "ruff check workflow utils && snakefmt --check workflow && snakemake --lint && Rscript -e 'quit(status = length(lintr::lint_dir(\"workflow\")) > 0)'", description = "Lint everything (no changes)" }
hooks = { cmd = "pre-commit install", description = "Install git pre-commit hooks" }
